<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<!-- NAVBAR -->
<nav class="navbar">
  <button class="navbar-logo" (click)="goToShop()" type="button">
    <img src="/assets/logo/logo-coplaca-apaisado.png" alt="Coplaca logo" class="nav-logo-img" />
  </button>

  <div class="navbar-links">
    <a (click)="goToShop()">Tienda</a>
    <a (click)="goToOrders()">Tus pedidos</a>
    <a (click)="goToCart()">
      Tu carrito
      <mat-icon>shopping_cart</mat-icon>
    </a>
  </div>

  <button class="profile-btn" (click)="goToProfile()">
    <mat-icon>person</mat-icon>
  </button>
</nav>

<!-- MAIN CONTENT -->
<main class="main-content">
  <!-- TARJETA PERFIL -->
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">
        <mat-icon>person</mat-icon>
      </div>
      <h1 class="profile-title">¡Aquí tienes tu espacio!</h1>
    </div>

    <div class="profile-data">
      <p><strong>Nombre:</strong> <input [(ngModel)]="firstName" /></p>
      <p><strong>Apellidos:</strong> <input [(ngModel)]="lastName" /></p>
      <p><strong>Email:</strong> {{ user?.email }}</p>
      <p><strong>Telefono:</strong> <input [(ngModel)]="phoneNumber" /></p>
      <p><strong>Calle:</strong> <input [(ngModel)]="street" /></p>
      <p><strong>Numero:</strong> <input [(ngModel)]="streetNumber" /></p>
      <p><strong>Piso/Apto:</strong> <input [(ngModel)]="apartment" /></p>
      <p><strong>Ciudad:</strong> <input [(ngModel)]="city" /></p>
      <p><strong>Provincia:</strong> <input [(ngModel)]="province" /></p>
      <p><strong>Codigo postal:</strong> <input [(ngModel)]="postalCode" /></p>
      <p><strong>Info adicional:</strong> <input [(ngModel)]="additionalInfo" /></p>
      <p><strong>Almacen asignado:</strong> {{ user?.warehouseName || 'Sin asignar' }}</p>
      <p *ngIf="message"><strong>{{ message }}</strong></p>
    </div>
  </div>

  <!-- BOTONES -->
  <button class="btn-edit" (click)="editInfo()">Editar información</button>

  <div class="btn-row">
    <button class="btn-baja" (click)="darDeBaja()">Dar de baja</button>
    <button class="btn-pedidos" (click)="irAPedidos()">Ir a pedidos &gt;</button>
  </div>
</main>
