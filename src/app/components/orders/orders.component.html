<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-logo" (click)="goToShop()">
    <img src="/assets/logo/logo-coplaca-apaisado.png" alt="Coplaca logo" class="nav-logo-img" />
  </div>
  <div class="navbar-links">
    <a (click)="goToShop()">Tienda</a>
    <a (click)="goToOrders()">Tus pedidos</a>
    <a (click)="goToCart()">
      Tu carrito
      <mat-icon>shopping_cart</mat-icon>
    </a>
  </div>
  <button class="profile-btn" (click)="goToProfile()">
    <mat-icon>person</mat-icon>
  </button>
</nav>

<!-- MAIN -->
<main class="main-content">
  <div class="orders-card">
    <h2 class="orders-title">Pedidos</h2>
    <div class="orders-scroll">
      <!-- HARDCODEADO -->
      <div class="order-item" *ngFor="let p of pedidos">
        <div class="order-row">
          <div class="order-left">
            <span class="order-id">{{ p.id }}</span>
            <span class="order-estado">{{ p.estado }}</span>
          </div>
          <div class="order-right">
            <span class="order-fecha">{{ p.fecha }}</span>
            <span class="order-total">Total pedido: {{ p.total }}</span>
          </div>
        </div>
        <button class="btn-detalles" (click)="verDetalles(p)">Ver detalles</button>
      </div>
      <!-- /HARDCODEADO -->
    </div>
  </div>
</main>

<!-- DIALOG OVERLAY -->
<div class="dialog-overlay" *ngIf="dialogVisible" (click)="cerrarDialog()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <!-- CABECERA -->
    <div class="dialog-header">
      <span class="dialog-id">{{ pedidoSeleccionado?.id }}</span>
      <span class="dialog-fecha">{{ pedidoSeleccionado?.fecha }}</span>
      <span class="dialog-estado">{{ pedidoSeleccionado?.estado }}</span>
    </div>

    <!-- PRODUCTOS -->
    <div class="dialog-products">
      <!-- HARDCODEADO -->
      <div class="dialog-product" *ngFor="let prod of detalleProductos">
        <img src="/assets/test/Banana.png" alt="producto" class="dialog-product-img" />
        <span class="dialog-product-name">{{ prod.nombre }}</span>
        <span class="dialog-product-cantidad">{{ prod.cantidad }}</span>
        <span class="dialog-product-precio">{{ prod.precioPeso }}</span>
      </div>
      <!-- /HARDCODEADO -->
    </div>

    <!-- FOOTER -->
    <div class="dialog-footer">
      <button class="btn-cancelar" (click)="cancelarPedido()">Cancelar pedido</button>
    </div>
  </div>
</div>
