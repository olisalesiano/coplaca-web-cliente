<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-logo" (click)="goToShop()">
    <img src="/assets/logo/logo-coplaca-apaisado.png" alt="Coplaca logo" class="nav-logo-img" />
  </div>

  <div class="navbar-links">
    <a (click)="goToShop()">Tienda</a>
    <a (click)="goToOrders()">Tus pedidos</a>
    <a (click)="goToCart()"> Tu carrito <mat-icon>shopping_cart</mat-icon></a>
  </div>

  <button class="profile-btn" (click)="goToProfile()">
    <mat-icon>person</mat-icon>
  </button>
</nav>

<!-- MAIN: layout fijo en pantalla -->
<main class="main-content">
  <!-- CARRITO (scroll interno) -->
  <div class="cart-section">
    <div class="cart-card">
      <h2 class="cart-title">Tu carrito</h2>

      <div class="cart-scroll">
        <!-- HARDCODEADO -->
        <div class="cart-item" *ngFor="let item of cartItems">
          <img src="/assets/test/Banana.png" alt="producto" class="cart-item-img" />
          <span class="cart-item-name">{{ item.nombre }}</span>
          <div class="cart-item-details">
            <span> Cantidad: {{ item.cantidad }} </span>
            <span>Precio: {{ item.precio }}</span>
            <span>Peso: {{ item.peso }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SUGERENCIAS -->
  <div class="sugerencias-section">
    <p class="sugerencias-label">No pierdas la oportunidad:</p>
    <div class="sugerencias-scroll">
      <!-- HARDCODEADO -->
      <div class="sug-card" *ngFor="let s of sugerencias">
        <img src="/assets/test/Banana.png" alt="producto" class="sug-img" />
        <span class="sug-name">{{ s.nombre }}</span>
        <button class="btn-add">Añadir</button>
      </div>
    </div>
  </div>

  <!-- FOOTER: total + pagar -->
  <div class="cart-footer">
    <span class="total-label">Total pedido: {{ totalPedido }}</span>
    <button class="btn-pagar" (click)="pagar()">Pagar</button>
  </div>
</main>
