<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<!-- NAVBAR -->
<nav class="navbar">
  <button class="navbar-logo" (click)="goToShop()" type="button">
    <img src="/assets/logo/logo-coplaca-apaisado.png" alt="Coplaca logo" class="nav-logo-img" />
  </button>

  <div class="navbar-links">
    <a (click)="goToShop()">Tienda</a>
    <a (click)="goToOrders()">Tus pedidos</a>
    <a (click)="goToCart()"> Tu carrito <mat-icon>shopping_cart</mat-icon></a>
  </div>

  <button class="profile-btn" (click)="goToProfile()">
    <mat-icon>person</mat-icon>
  </button>
</nav>

<!-- MAIN: layout fijo en pantalla -->
<main class="main-content">
  <!-- CARRITO (scroll interno) -->
  <div class="cart-section">
    <div class="cart-card">
      <h2 class="cart-title">Tu carrito</h2>

      <div class="cart-scroll">
        <div class="cart-item" *ngFor="let item of cartItems">
          <img [src]="item.imageUrl || '/assets/test/Banana.png'" alt="producto" class="cart-item-img" />
          <span class="cart-item-name">{{ item.name }}</span>
          <div class="cart-item-details">
            <span>
              Cantidad:
              <button class="btn-add" (click)="decrement(item)">-</button>
              {{ item.quantityKg }} kg
              <button class="btn-add" (click)="increment(item)">+</button>
            </span>
            <span>Precio: {{ item.unitPrice }} €/kg</span>
            <span>Subtotal: {{ item.quantityKg * item.unitPrice | number:'1.2-2' }} €</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sugerencias-section" *ngIf="message">
    <p class="sugerencias-label">{{ message }}</p>
  </div>

  <!-- FOOTER: total + pagar -->
  <div class="cart-footer">
    <span class="total-label">Total pedido: {{ totalPedido | number:'1.2-2' }} €</span>
    <button class="btn-pagar" (click)="pagar()">Pagar</button>
  </div>
</main>
