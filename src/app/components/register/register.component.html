<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<div class="login-wrapper">
  <!-- LOGO -->
  <div class="logo-container">
    <img src="/assets/logo/logo-login-coplaca.png" class="image-logo" alt="logo coplaca" />
  </div>

  <!-- CARD -->
  <div class="login-card">
    <h1 class="title">Registrar</h1>
    <p class="subtitle">Productos frescos directos a tu casa</p>

    <div class="form-grid">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" [(ngModel)]="firstName" placeholder="Introduzca su nombre..." />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            placeholder="••••••••••••"
          />
          <button class="toggle-eye" type="button" (click)="togglePassword()">
            <mat-icon>remove_red_eye</mat-icon>
            <svg
              *ngIf="!showPassword"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
              />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" [(ngModel)]="lastName" placeholder="Introduzca sus apellidos..." />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" placeholder="Introduzca su email..." />
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="phone">Telefono</label>
        <input type="text" id="phone" [(ngModel)]="phoneNumber" placeholder="Introduzca su telefono..." />
      </div>
      <div class="form-group">
        <label for="street">Calle</label>
        <input type="text" id="street" [(ngModel)]="street" placeholder="Calle" />
      </div>
      <div class="form-group">
        <label for="streetNumber">Numero</label>
        <input type="text" id="streetNumber" [(ngModel)]="streetNumber" placeholder="Numero" />
      </div>
      <div class="form-group">
        <label for="apartment">Piso/Apto</label>
        <input type="text" id="apartment" [(ngModel)]="apartment" placeholder="Piso/Apto" />
      </div>
      <div class="form-group">
        <label for="city">Ciudad</label>
        <input type="text" id="city" [(ngModel)]="city" placeholder="Ciudad" />
      </div>
      <div class="form-group">
        <label for="province">Provincia</label>
        <input type="text" id="province" [(ngModel)]="province" placeholder="Provincia" />
      </div>
      <div class="form-group">
        <label for="postalCode">Codigo postal</label>
        <input type="text" id="postalCode" [(ngModel)]="postalCode" placeholder="Codigo postal" />
      </div>
      <div class="form-group">
        <label for="additionalInfo">Info adicional</label>
        <input type="text" id="additionalInfo" [(ngModel)]="additionalInfo" placeholder="Referencia de entrega" />
      </div>
    </div>

    <button class="btn-login" (click)="register()" [disabled]="loading">
      {{ loading ? 'Creando...' : 'Crear' }}
    </button>

    <p class="register-link" *ngIf="error">{{ error }}</p>

    <p class="register-link">
      ¿Ya tiene una cuenta? <a (click)="goToLogin()">Iniciar sesión...</a>
    </p>
  </div>
</div>
