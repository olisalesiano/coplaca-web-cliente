<div class="admin-shell">
  <header class="admin-navbar">
    <div class="brand-container">
      <button class="brand" type="button" routerLink="/admin/users">
        <img src="/assets/logo/logo-coplaca-apaisado.png" alt="Coplaca logo" />
      </button>
      <span class="user-status">Administracion</span>
    </div>

    <nav class="links">
      <button type="button" routerLink="/admin/users" routerLinkActive="active-link">
        Cuentas
      </button>
      <button type="button" routerLink="/admin/stats" routerLinkActive="active-link">
        Estadisticas
      </button>
      <button type="button" routerLink="/admin/profile" routerLinkActive="active-link">
        Perfil
      </button>
    </nav>

    <div class="admin-actions">
      <button class="profile-chip" type="button" routerLink="/admin/profile">
        <mat-icon>person</mat-icon>
        <span>{{ adminDisplayName }}</span>
      </button>

      <button class="logout-btn" type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Salir
      </button>
    </div>
  </header>

  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>
</div>
