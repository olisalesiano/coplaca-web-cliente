<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<div class="login-wrapper">
  <!-- LOGO -->
  <div class="logo-container">
    <img src="/assets/logo/logo-login-coplaca.png" class="image-logo" alt="logo coplaca" />
  </div>

  <!-- CARD -->
  <div class="login-card">
    <h1 class="title">Iniciar sesión</h1>
    <p class="subtitle">Productos frescos directos a tu casa</p>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="email" placeholder="Introduzca su email..." />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" placeholder="••••••••••••" />

        <button class="toggle-eye" type="button" (click)="togglePassword()">
          <!-- Ojo abierto: contraseña visible -->
          <mat-icon *ngIf="showPassword">remove_red_eye</mat-icon>
          <!-- Ojo tachado: contraseña oculta -->
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-login" (click)="login()" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Iniciar sesión' }}
    </button>

    <p class="login-error" *ngIf="error" role="alert" aria-live="assertive">{{ error }}</p>

    <p class="register-link">
      ¿No tiene una cuenta? <a (click)="goToRegister()">Registrate...</a>
    </p>
  </div>
</div>
